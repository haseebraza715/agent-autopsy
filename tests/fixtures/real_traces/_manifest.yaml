# Labels: hand-specified per trace from the scenario each fixture intends,
# NOT derived from detector output. Metrics are corpus-relative regression
# results, not a measure of accuracy on unseen production traces.
#   must_include: patterns that MUST be detected (positive control; recall / TP).
#   must_not_include: patterns that MUST NOT be detected (negative control; FP).
#   clean: no patterns expected; any detection is a false positive.
#   skip_eval: excluded from metrics.
