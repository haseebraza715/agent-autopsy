name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]"

      - name: Run tests
        run: pytest

      - name: Ruff
        run: ruff check src scripts tests

      - name: Detector corpus eval
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python scripts/eval_detectors.py --json-out /tmp/detector-eval.json

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  wheel-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install wheel into a clean environment and smoke-test the CLI
        # Runs from a temporary directory outside any checkout so a local
        # source tree cannot mask problems with the installed package.
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          ./smoke-venv/bin/autopsy --help
          ./smoke-venv/bin/python -c "import agent_autopsy"
          # Regression guard: the wheel must not install a top-level 'src'.
          if ./smoke-venv/bin/python -c "import src" 2>/dev/null; then
            echo "wheel installed a top-level 'src' package" >&2
            exit 1
          fi

  publish:
    needs: wheel-smoke
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC) only: configure this repository as a trusted
    # publisher on PyPI; no API token secret is used.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
