[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-autopsy"
version = "0.4.0"
description = "Analyze and debug AI agent traces with deterministic and LLM-assisted workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Haseeb Raza" }
]
dependencies = [
  "pydantic>=2.0,<3.0",
  "typer>=0.9,<1.0",
  "rich>=13.0,<14.0",
  "httpx>=0.25,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
llm = [
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "openai>=1.0,<3.0",
]
gui = [
  "streamlit>=1.29,<2.0",
]
mcp = [
  "mcp>=1.0,<2.0",
]
dev = [
  "pytest>=7.0,<9.0",
  "pytest-asyncio>=0.21,<1.0",
]
full = [
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "openai>=1.0,<3.0",
  "streamlit>=1.29,<2.0",
  "mcp>=1.0,<2.0",
  "pytest>=7.0,<9.0",
  "pytest-asyncio>=0.21,<1.0",
]

[project.scripts]
autopsy = "src.cli:main"
autopsy-mcp = "src.mcp.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]
